<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chia sẻ trải nghiệm — Hiền Lê Garden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Cảm ơn bạn đã ghé Hiền Lê Garden!</h1>
    <p>Chia sẻ trải nghiệm để nhận mã ưu đãi cho lần sau.</p>

    <form id="surveyForm">
      <label>Họ tên <input type="text" name="guestName" required /></label>
      <label>Số điện thoại <input type="tel" name="phone" required /></label>
      <label>Email (không bắt buộc) <input type="email" name="email" /></label>
      <label class="checkbox"><input type="checkbox" name="wantsTelegram" /> Nhận mã qua Telegram</label>
      <label>Ngày lưu trú (không bắt buộc) <input type="date" name="stayDate" /></label>

      <fieldset>
        <legend>Đánh giá trải nghiệm</legend>
        <div class="rating" role="radiogroup" aria-label="Đánh giá 1 đến 5 sao">
          <label><input type="radio" name="rating" value="1" required /> 1</label>
          <label><input type="radio" name="rating" value="2" /> 2</label>
          <label><input type="radio" name="rating" value="3" /> 3</label>
          <label><input type="radio" name="rating" value="4" /> 4</label>
          <label><input type="radio" name="rating" value="5" /> 5</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Hoạt động yêu thích (không bắt buộc)</legend>
        <div class="activities">
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="bbq" /> BBQ & lửa trại</label>
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="ca-phe-vuon" /> Cà phê vườn</label>
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="nong-nghiep" /> Trải nghiệm nông nghiệp (hái cà phê, cho cá ăn)</label>
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="cau-ca-cheo-thuyen" /> Câu cá / chèo thuyền</label>
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="chup-anh" /> Chụp ảnh giữa thiên nhiên</label>
          <label class="checkbox"><input type="checkbox" name="favoriteActivities" value="rang-ca-phe" /> Workshop rang cà phê</label>
        </div>
      </fieldset>

      <label>Ghi chú trải nghiệm (không bắt buộc) <textarea name="comment"></textarea></label>
      <label>Mong muốn lần sau (không bắt buộc) <textarea name="wishesNextTime"></textarea></label>
      <label class="checkbox">
        <input type="checkbox" name="consentGiven" required />
        Tôi đồng ý để Hiền Lê Garden sử dụng thông tin này để liên hệ ưu đãi.
      </label>

      <button type="submit">Gửi đánh giá</button>
      <p id="formError" class="error" role="alert"></p>
    </form>

    <section id="confirmation" hidden>
      <h2>Cảm ơn bạn!</h2>
      <p>Mã ưu đãi của bạn: <strong id="promoCode"></strong></p>
      <p id="promoDetails"></p>
      <p id="giftLine" hidden>Mang mã này đến quầy lễ tân — nếu quà lưu niệm vẫn còn, bạn sẽ được nhận thêm nhé!</p>
      <a id="telegramLink" href="#" hidden>Nhận mã qua Telegram</a>
    </section>
  </main>

  <script src="survey.js"></script>
</body>
</html>
